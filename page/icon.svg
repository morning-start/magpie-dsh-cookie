<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="DSH Cookie 看板">
  <title>DSH Cookie 看板</title>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0f3d3a"/>
  <!-- 请求头占用环：底环 + 约 70% 高亮 -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#2dd4bf" stroke-opacity="0.22" stroke-width="4"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round"
          stroke-dasharray="97 42" transform="rotate(-90 32 32)"/>
  <!-- cookie 本体，右上角咬一口 -->
  <circle cx="32" cy="32" r="15" fill="#f6e7c8"/>
  <circle cx="45" cy="19" r="6.5" fill="#0f3d3a"/>
  <!-- 巧克力豆 -->
  <circle cx="27" cy="27" r="2.8" fill="#7a4a22"/>
  <circle cx="36" cy="31" r="2.2" fill="#7a4a22"/>
  <circle cx="29" cy="38" r="2.4" fill="#7a4a22"/>
  <circle cx="38" cy="39" r="1.8" fill="#7a4a22"/>
</svg>
